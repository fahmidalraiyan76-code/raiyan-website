<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#05050b"
>

<title>RAIYAN — Beyond The Ordinary</title>

<style>

/* =========================================================
   01 — RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#030309;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

button,
a{
    font-family:inherit;
}

section{
    position:relative;
    min-height:100vh;
    overflow:hidden;
}


/* =========================================================
   02 — GLOBAL EFFECTS
========================================================= */

.noise{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    opacity:.045;

    background-image:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            #fff 3px
        );
}

.cursor-glow{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    pointer-events:none;
    z-index:2;

    background:radial-gradient(
        circle,
        rgba(0,238,255,.12),
        transparent 70%
    );

    transform:translate(-50%,-50%);
    mix-blend-mode:screen;
}

::-webkit-scrollbar{
    width:7px;
}

::-webkit-scrollbar-track{
    background:#030309;
}

::-webkit-scrollbar-thumb{
    background:linear-gradient(
        #00eaff,
        #b000ff
    );
    border-radius:20px;
}


/* =========================================================
   03 — LOADER
========================================================= */

.loader{
    position:fixed;
    inset:0;
    z-index:10000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#030309;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

.loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader-inner{
    text-align:center;
}

.loader-name{
    font-size:55px;
    font-weight:900;
    letter-spacing:15px;

    background:linear-gradient(
        90deg,
        #00eaff,
        #fff,
        #ff20c8,
        #00eaff
    );

    background-size:300%;

    -webkit-background-clip:text;
    color:transparent;

    animation:loaderGradient 2s linear infinite;
}

.loader-line{
    width:260px;
    height:2px;
    margin:20px auto;

    background:#171725;
    overflow:hidden;
}

.loader-line span{
    display:block;
    width:30%;
    height:100%;

    background:#00eaff;

    animation:loaderLine 1.3s infinite;
}

.loader-small{
    color:#777;
    font-size:10px;
    letter-spacing:5px;
}


/* =========================================================
   04 — HERO
========================================================= */

.hero{
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(90,0,150,.32),
            transparent 30%
        ),
        radial-gradient(
            circle at 15% 80%,
            rgba(0,210,255,.13),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #03030a,
            #080014,
            #02070d
        );
}

.hero-grid{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:70px 70px;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            #000 20%,
            #000 80%,
            transparent
        );

    animation:gridMove 15s linear infinite;
}

.hero-content{
    position:relative;
    z-index:20;

    width:min(1200px,92%);
    text-align:center;
}

.eyebrow{
    font-size:11px;
    letter-spacing:9px;
    color:#76eaff;

    opacity:0;
    transform:translateY(20px);

    animation:
        reveal 1s .6s forwards;
}

.hero-name{
    position:relative;

    margin:10px 0;

    font-size:
        clamp(
            65px,
            15vw,
            190px
        );

    line-height:.9;

    font-weight:1000;
    letter-spacing:8px;

    background:
        linear-gradient(
            90deg,
            #ff1493,
            #7b2cff,
            #00eaff,
            #ffffff,
            #00eaff,
            #7b2cff,
            #ff1493
        );

    background-size:500%;

    -webkit-background-clip:text;
    color:transparent;

    animation:
        heroGradient 7s linear infinite,
        heroNameIn 1.4s ease forwards;

    filter:
        drop-shadow(0 0 20px rgba(0,234,255,.2));
}

.name-line{
    width:0;
    height:2px;

    margin:25px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00eaff,
            #ff20c8,
            transparent
        );

    animation:nameLine 1.5s 1.2s forwards;
}

.hero-tag{
    font-size:
        clamp(12px,2vw,19px);

    letter-spacing:4px;
    color:#aaaabe;

    opacity:0;

    animation:
        reveal 1s 1.5s forwards;
}

.hero-description{
    width:min(760px,95%);
    margin:28px auto;

    color:#b7b7c9;

    font-size:16px;
    line-height:1.9;

    opacity:0;

    animation:
        reveal 1s 1.9s forwards;
}

.hero-description strong{
    color:#fff;
}

.hero-description .cyan{
    color:#00eaff;
}

.hero-description .pink{
    color:#ff42cf;
}

.hero-description .gold{
    color:#ffd166;
}

.enter-button{
    display:inline-flex;

    align-items:center;
    justify-content:center;
    gap:10px;

    padding:15px 30px;

    border:1px solid rgba(0,234,255,.5);
    border-radius:100px;

    color:#fff;
    text-decoration:none;

    background:
        linear-gradient(
            90deg,
            rgba(0,234,255,.1),
            rgba(155,0,255,.1)
        );

    box-shadow:
        0 0 25px rgba(0,234,255,.08);

    opacity:0;

    animation:
        reveal 1s 2.2s forwards;

    transition:.4s;
}

.enter-button:hover{
    transform:
        translateY(-5px)
        scale(1.04);

    background:
        linear-gradient(
            90deg,
            #00eaff,
            #8a2be2
        );

    box-shadow:
        0 0 40px rgba(0,234,255,.35);
}


/* =========================================================
   05 — HERO PARTICLES
========================================================= */

.particles{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.particle{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#fff;

    opacity:.6;

    animation:
        particleFloat
        linear
        infinite;
}


/* =========================================================
   06 — RUNNING ANIME CHARACTER
========================================================= */

.runner{
    position:absolute;

    width:100px;
    height:150px;

    left:-150px;
    top:15%;

    z-index:30;

    animation:
        runnerAcross
        8s
        linear
        infinite;
}

.runner-shadow{
    position:absolute;

    width:90px;
    height:15px;

    left:5px;
    bottom:-3px;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(0,0,0,.7),
            transparent
        );

    animation:
        shadowPulse
        .25s
        infinite
        alternate;
}

.r-head{
    position:absolute;

    width:44px;
    height:44px;

    left:28px;
    top:3px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #ffc09b,
            #d87959
        );

    z-index:5;
}

.r-hair{
    position:absolute;

    width:52px;
    height:35px;

    left:24px;
    top:-6px;

    z-index:7;

    background:
        linear-gradient(
            135deg,
            #171725,
            #05050a
        );

    clip-path:
        polygon(
            0 80%,
            12% 30%,
            25% 65%,
            37% 10%,
            50% 60%,
            66% 0,
            73% 55%,
            90% 15%,
            100% 75%,
            100% 100%,
            0 100%
        );
}

.r-band{
    position:absolute;

    width:48px;
    height:8px;

    left:26px;
    top:25px;

    z-index:9;

    background:#25284b;

    border:1px solid #00eaff;
}

.r-eye{
    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#111;

    top:34px;
    z-index:10;
}

.r-eye.left{
    left:38px;
}

.r-eye.right{
    left:54px;
}

.r-body{
    position:absolute;

    width:55px;
    height:65px;

    left:22px;
    top:44px;

    border-radius:15px 15px 10px 10px;

    background:
        linear-gradient(
            135deg,
            #252b58,
            #0b0d20
        );

    border:
        1px solid
        rgba(0,234,255,.3);
}

.r-scarf{
    position:absolute;

    width:80px;
    height:10px;

    left:10px;
    top:46px;

    z-index:12;

    background:
        linear-gradient(
            90deg,
            #ff225f,
            #7c1dff
        );

    transform:rotate(-8deg);

    animation:
        scarfWave
        .25s
        infinite
        alternate;
}

.r-arm{
    position:absolute;

    width:13px;
    height:55px;

    top:53px;

    border-radius:20px;

    background:#202448;

    transform-origin:top center;

    z-index:2;
}

.r-arm.left{
    left:15px;

    transform:rotate(55deg);

    animation:
        armRunA
        .22s
        infinite
        alternate;
}

.r-arm.right{
    right:8px;

    transform:rotate(-55deg);

    animation:
        armRunB
        .22s
        infinite
        alternate;
}

.r-leg{
    position:absolute;

    width:15px;
    height:58px;

    top:98px;

    border-radius:20px;

    background:#15172e;

    transform-origin:top center;
}

.r-leg.left{
    left:30px;

    animation:
        legRunA
        .22s
        infinite
        alternate;
}

.r-leg.right{
    left:54px;

    animation:
        legRunB
        .22s
        infinite
        alternate;
}


/* =========================================================
   07 — SECRET PEEK CHARACTER
========================================================= */

.peek-zone{
    position:absolute;

    right:3%;
    bottom:12%;

    width:130px;
    height:180px;

    z-index:40;
}

.peek-wall{
    position:absolute;

    right:0;
    bottom:0;

    width:80px;
    height:170px;

    border-radius:
        15px
        15px
        0
        0;

    background:
        linear-gradient(
            90deg,
            #151521,
            #303044
        );

    box-shadow:
        -10px 0 30px rgba(0,0,0,.5);
}

.peek-person{
    position:absolute;

    right:55px;
    bottom:55px;

    width:65px;
    height:100px;

    animation:
        peek
        5s
        ease-in-out
        infinite;
}

.peek-head{
    position:absolute;

    width:45px;
    height:45px;

    left:10px;

    border-radius:50%;

    background:#f0ad83;
}

.peek-hair{
    position:absolute;

    width:52px;
    height:30px;

    top:-5px;

    border-radius:50%;

    background:#161622;
}

.peek-eye{
    position:absolute;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#111;

    top:25px;
}

.peek-eye.one{
    left:20px;
}

.peek-eye.two{
    left:34px;
}

.peek-body{
    position:absolute;

    width:55px;
    height:55px;

    top:42px;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #ff3b81,
            #6a21c7
        );
}


/* =========================================================
   08 — ABOUT SECTION
========================================================= */

.about{
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(0,234,255,.08),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(255,0,180,.09),
            transparent 25%
        ),
        #05050e;
}

.about-wrap{
    width:min(1150px,92%);
    position:relative;
    z-index:10;
}

.section-label{
    font-size:10px;
    letter-spacing:7px;
    color:#00eaff;
    margin-bottom:15px;
}

.section-heading{
    font-size:
        clamp(
            40px,
            7vw,
            85px
        );

    line-height:1;

    margin-bottom:25px;

    font-weight:900;

    background:
        linear-gradient(
            90deg,
            #fff,
            #8e7aff,
            #00eaff
        );

    -webkit-background-clip:text;
    color:transparent;
}

.about-lead{
    max-width:800px;

    color:#aeb0c2;

    font-size:17px;
    line-height:2;
}

.about-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;

    margin-top:45px;
}

.about-card{
    position:relative;

    min-height:240px;

    padding:30px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.025)
        );

    backdrop-filter:blur(15px);

    overflow:hidden;

    transition:.5s;
}

.about-card::before{
    content:"";

    position:absolute;

    width:120px;
    height:120px;

    right:-50px;
    top:-50px;

    border-radius:50%;

    background:#00eaff;

    filter:blur(55px);

    opacity:.15;
}

.about-card:hover{
    transform:
        translateY(-12px)
        rotateX(4deg);

    border-color:
        rgba(0,234,255,.5);

    box-shadow:
        0 20px 60px
        rgba(0,234,255,.08);
}

.card-number{
    font-size:11px;
    color:#55586d;
    letter-spacing:3px;
}

.card-icon{
    font-size:38px;
    margin:20px 0 15px;
}

.about-card h3{
    font-size:21px;
    margin-bottom:12px;
}

.about-card p{
    color:#8d8fa5;
    line-height:1.8;
    font-size:14px;
}


/* =========================================================
   09 — FLOATING CHARACTER IN ABOUT
========================================================= */

.float-character{
    position:absolute;

    right:8%;
    top:13%;

    width:85px;
    height:120px;

    animation:
        floatCharacter
        4s
        ease-in-out
        infinite;
}

.fc-head{
    width:42px;
    height:42px;

    position:absolute;

    left:20px;

    border-radius:50%;

    background:#e7a47d;
}

.fc-body{
    width:55px;
    height:65px;

    position:absolute;

    top:42px;
    left:14px;

    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #4732c8
        );
}

.fc-ring{
    position:absolute;

    width:100px;
    height:100px;

    left:-7px;
    top:-30px;

    border-radius:50%;

    border:
        1px solid
        rgba(0,234,255,.4);

    animation:
        ringRotate
        4s
        linear
        infinite;
}


/* =========================================================
   10 — LOCATION SECTION
========================================================= */

.location{
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            180deg,
            #061017,
            #071d24
        );
}

.location::before{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            transparent 95%,
            rgba(0,234,255,.2) 100%
        );

    background-size:
        100% 45px;

    opacity:.3;
}

.city-light{
    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 15px #00eaff;

    animation:
        cityBlink
        1.5s
        infinite
        alternate;
}

.location-content{
    position:relative;
    z-index:10;

    width:min(1000px,92%);
    text-align:center;
}

.map-ring{
    position:relative;

    width:220px;
    height:220px;

    margin:auto;

    border:
        1px solid
        rgba(0,234,255,.3);

    border-radius:50%;

    animation:
        ringPulse
        3s
        infinite;
}

.map-ring::before,
.map-ring::after{
    content:"";

    position:absolute;

    inset:25px;

    border:
        1px dashed
        rgba(0,234,255,.2);

    border-radius:50%;
}

.map-ring::after{
    inset:60px;
}

.location-pin{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    font-size:65px;

    animation:
        pinDrop
        2s
        ease-in-out
        infinite
        alternate;
}

.location-title{
    margin-top:35px;

    font-size:
        clamp(
            38px,
            8vw,
            90px
        );

    font-weight:900;

    letter-spacing:5px;

    background:
        linear-gradient(
            90deg,
            #00eaff,
            #fff,
            #00eaff
        );

    background-size:200%;

    -webkit-background-clip:text;
    color:transparent;

    animation:
        heroGradient
        4s
        linear
        infinite;
}

.location-description{
    width:min(680px,95%);
    margin:20px auto;

    color:#8da5aa;
    line-height:1.9;
}


/* =========================================================
   11 — SURPRISED CHARACTER
========================================================= */

.surprised{
    position:absolute;

    left:8%;
    bottom:12%;

    width:110px;
    height:150px;

    animation:
        surprisedMove
        5s
        ease-in-out
        infinite;
}

.s-head{
    position:absolute;

    width:55px;
    height:55px;

    left:25px;

    border-radius:50%;

    background:#d99370;
}

.s-eye{
    position:absolute;

    width:10px;
    height:10px;

    top:25px;

    border-radius:50%;

    background:#101018;

    z-index:5;
}

.s-eye.one{
    left:40px;
}

.s-eye.two{
    left:58px;
}

.s-mouth{
    position:absolute;

    width:13px;
    height:18px;

    border:3px solid #101018;

    border-radius:50%;

    left:51px;
    top:39px;
}

.s-body{
    position:absolute;

    width:65px;
    height:75px;

    top:55px;
    left:20px;

    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            #ffbc2c,
            #ff4b2b
        );
}


/* =========================================================
   12 — DREAM SECTION
========================================================= */

.dream{
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 40%,
            #32145c,
            #0b0516 45%,
            #020204 90%
        );
}

.moon{
    position:absolute;

    width:180px;
    height:180px;

    border-radius:50%;

    right:12%;
    top:12%;

    background:
        radial-gradient(
            circle at 35% 35%,
            #fff,
            #c9d5ff
        );

    box-shadow:
        0 0 80px
        rgba(190,210,255,.4);
}

.moon::after{
    content:"";

    position:absolute;

    width:170px;
    height:170px;

    border-radius:50%;

    background:#160a25;

    left:45px;
    top:-10px;
}

.dream-content{
    position:relative;

    z-index:10;

    width:min(950px,92%);

    text-align:center;
}

.dream-label{
    color:#a78bfa;

    font-size:11px;

    letter-spacing:8px;
}

.dream-title{
    margin:20px 0;

    font-size:
        clamp(
            50px,
            10vw,
            110px
        );

    font-weight:900;

    background:
        linear-gradient(
            90deg,
            #ffd166,
            #ff57c8,
            #9b6cff,
            #00eaff
        );

    background-size:300%;

    -webkit-background-clip:text;
    color:transparent;

    animation:
        heroGradient
        6s
        linear
        infinite
